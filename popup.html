<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jira Monthly Worklog</title>
  </head>
  <body>
    <main class="app">
      <header class="controls">
        <label class="field">
          <span>Jira Base URL</span>
          <input id="baseUrlInput" type="text" placeholder="https://your-company.atlassian.net" />
        </label>
        <label class="field">
          <span>Worklog users (optional, comma-separated)</span>
          <input id="userInput" type="text" list="userSuggestions" placeholder="e.g. john.doe, jane.smith — type 2+ chars to autocomplete" />
          <datalist id="userSuggestions"></datalist>
        </label>
        <div class="row">
          <button id="useCurrentTabBtn" type="button">Use current tab</button>
          <button id="refreshBtn" type="button">Refresh</button>
        </div>

        <label class="field">
          <span>Month</span>
          <select id="monthOffsetSelect"></select>
        </label>
      </header>

      <section class="summary">
        <div><strong id="monthLabel">-</strong></div>
        <div>Total: <strong id="totalTime">0h 0m</strong></div>
        <div class="meta" id="metaInfo"></div>
      </section>

      <section id="status" class="status hidden"></section>

      <section class="tableWrap">
        <table id="worklogTable" class="hidden">
          <thead>
            <tr>
              <th>Date</th>
              <th>User</th>
              <th>Issue</th>
              <th>Summary</th>
              <th>Logged time</th>
              <th>Project</th>
            </tr>
          </thead>
          <tbody id="worklogTableBody"></tbody>
        </table>
      </section>

      <footer class="footer">
        <button id="exportBtn" type="button" disabled>Export CSV</button>
        <button id="exportSummaryBtn" type="button" disabled>Export Summary CSV</button>
      </footer>
    </main>

    <script type="module" src="/src/popup/popup.ts"></script>
  </body>
</html>
